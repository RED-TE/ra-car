<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE:CAR 리카 · 신차 무료 상담 · 나에게 맞는 차 찾기</title>
<meta name="description" content="원하는 차량의 금융사별 조건을 비교 상담받으세요. 12가지 일상 질문으로 나도 몰랐던 자동차 취향을 찾아보세요.">
<meta property="og:title" content="RE:CAR 리카 · 신차 무료 상담 · 나에게 맞는 차 찾기">
<meta property="og:description" content="원하는 차량의 금융사별 조건을 비교 상담받으세요. 12가지 일상 질문으로 나도 몰랐던 자동차 취향을 찾아보세요.">
<meta property="og:image" content="/inquiry/landing-assets/assets/og.png">
<meta name="theme-color" content="#071233">
<link rel="icon" href="/inquiry/landing-assets/assets/favicon-64.png">
<link rel="preconnect" href="https://api.recarplan.com" crossorigin>
<link rel="stylesheet" href="/inquiry/landing-assets/css/style.css">
<link rel="stylesheet" href="/inquiry/showroom/landing.css">
<meta name="robots" content="noindex">
</head>
<body data-page="home" class="lp">
<main id="main">
  <div class="lp-page lp-app" id="lpApp">
    <header class="lp-top">
      <a class="lp-logo" href="https://recarplan.com/" aria-label="RE:CAR 리카 홈"><img src="/inquiry/landing-assets/assets/logo-sm.png" alt="RE:CAR" width="120" height="24"></a>
      <nav aria-label="바로가기">
        <a data-site-tel aria-label="전화 상담"><span data-ic="phone"></span></a>
        <a href="https://recarplan.com/app/" aria-label="리카 앱 열기" title="리카 앱 열기"><span data-ic="arrow"></span></a>
      </nav>
    </header>

    <section class="lp-hero" aria-label="추천 차량">
      <div class="lp-hero__tools">
        <div class="lp-hero__chip" id="lpHeroChip"></div>
        <button type="button" class="lp-hero__replay" id="lpHeroReplay" aria-label="배경 다시 재생" title="배경 다시 재생" hidden><span aria-hidden="true">↻</span></button>
      </div>
      <div class="lp-hero__stage">
        <div class="lp-hero__backdrop" aria-hidden="true">
          <img src="/inquiry/showroom/showroom-floor.jpg" width="1080" height="720" alt="" fetchpriority="high">
        </div>
        <div class="lp-hero__slides" id="lpHeroStage"><p class="loading"><span class="spin"></span>차량을 불러오고 있어요</p></div>
      </div>
      <div class="lp-dots" id="lpHeroDots"></div>
      <button type="button" class="lp-hero__cta" id="lpHeroCta" hidden></button>
      <a class="lp-app-link" href="https://recarplan.com/app/">더 많은 차량 앱에서 보기<span data-ic="arrow" aria-hidden="true"></span></a>
    </section>

    <!-- 상담 신청: 차종 → 이름 → 연락처 → 필수 동의 -->
    <aside class="lp-card" id="lpCard" aria-label="빠른 상담 신청">
      <h1 class="lp-title">장기렌트 상담 신청</h1>
      <p class="lp-desc">원하는 차와 연락처를 남겨주시면 리카가 조건을 비교해 안내해 드려요.</p>

      <form class="lp-funnel" id="lpFunnel" method="post" data-landing-inquiry="랜딩 빠른 상담" novalidate>
        <div class="lp-prog" aria-hidden="true"><span><i id="lpBar"></i></span><b id="lpCount">1 / 4</b></div>

        <section class="lp-step" data-step="car">
          <label class="lp-label" for="lpCarInput">희망 차종<i>*</i></label>
          <input class="lp-input" id="lpCarInput" name="vehicle" type="text" maxlength="100" autocomplete="off" placeholder="예: 쏘렌토, 그랜저, BMW 5시리즈" required>
          <button type="button" class="lp-link" id="lpUndecided">차종을 아직 못 정했어요</button>
        </section>

        <section class="lp-step" data-step="name" hidden>
          <label class="lp-label" for="lpName">이름<i>*</i></label>
          <input class="lp-input" id="lpName" name="name" maxlength="100" autocomplete="name" placeholder="이름" required>
        </section>

        <section class="lp-step" data-step="phone" hidden>
          <label class="lp-label" for="lpPhone">연락처<i>*</i></label>
          <input class="lp-input" id="lpPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="휴대폰 번호" required>
        </section>

        <section class="lp-step" data-step="agree" hidden>
          <p class="lp-label">필수 동의<i>*</i></p>
          <div class="lp-consent" data-consent></div>
        </section>

        <p class="lp-picked" id="lpPicked" hidden></p>
        <p class="lp-err" id="lpErr" role="alert"></p>
        <div class="lp-nav">
          <button type="button" class="lp-back" id="lpBack" hidden>이전</button>
          <button type="submit" class="lp-next" id="lpNext" disabled>다음</button>
        </div>
      </form>

      <div class="lp-done" id="lpDone" hidden></div>

      <button type="button" class="lp-testcta" data-test-open>
        <span><small>12가지 일상 질문으로 알아보는</small><b>내 취향은 무슨 차를 탈까?</b></span>
        <em data-ic="arrow"></em>
      </button>
    </aside>

    <div class="lp-rest">
        <div class="lp-banners" id="lpBanners">
          <button type="button" class="lp-banner lp-banner--test is-on" data-test-open>
            <span><small>12가지 일상 질문</small><b>내 취향은<br>무슨 차를 탈까?</b></span>
          </button>
          <a class="lp-banner" href="https://recarplan.com/landing/#quote">
            <img src="/inquiry/landing-assets/assets/hero/hero-executive.jpg" alt="" loading="lazy">
            <span><small>즉시출고</small><b id="lpStockBanner">재고가 있어<br>빨리 받는 차</b></span>
          </a>
          <a class="lp-banner" href="https://recarplan.com/landing/#special">
            <img src="/inquiry/landing-assets/assets/hero/hero-bmw.jpg" alt="" loading="lazy">
            <span><small>금융사 견적 비교</small><b>같은 차,<br>같은 조건끼리 비교</b></span>
          </a>
        </div>
        <div class="lp-dots lp-dots--center" id="lpBannerDots"></div>

        <div class="lp-grid">
          <div class="lp-menu">
            <p class="lp-menu__t">신차 상담</p>
            <a href="https://recarplan.com/inquiry/steps.html"><img src="/inquiry/landing-assets/assets/icons/quick-all-vehicles.webp" alt=""><span>셀프견적</span><em data-ic="chevR"></em></a>
            <a href="https://recarplan.com/landing/#compare"><img src="/inquiry/landing-assets/assets/icons/guide-rent-lease.webp" alt=""><span>렌트 · 리스 안내</span><em data-ic="chevR"></em></a>
            <a href="https://recarplan.com/landing/#quote"><img src="/inquiry/landing-assets/assets/icons/quick-suv.webp" alt=""><span>즉시출고 상담</span><em data-ic="chevR"></em></a>
          </div>
          <div class="lp-side">
            <a class="lp-tile" href="https://recarplan.com/landing/#business"><b>사업자<br>법인 견적</b><img src="/inquiry/landing-assets/assets/icons/guide-business.webp" alt=""></a>
            <button type="button" class="lp-tile" id="lpFocusForm"><b>빠른 상담</b><img src="/inquiry/landing-assets/assets/icons/quick-quote.webp" alt=""></button>
          </div>
        </div>
    </div>

    <footer class="lp-foot" id="lpFoot"></footer>
  </div>

  <!-- 상담 칸이 안 보일 때 아래에 붙는 막대 -->
  <div class="lp-mbar" id="lpMbar" hidden>
    <button type="button" class="lp-mbar__test" data-test-open>내 차 찾기</button>
    <button type="button" class="lp-mbar__ask" id="lpMbarAsk">비교 상담 신청하기</button>
  </div>

  <!-- 12문항 추천 -->
  <div class="lp-test" id="lpTest" role="dialog" aria-modal="true" aria-label="내 자동차 취향 테스트" hidden></div>

</main>

<script type="module" src="/inquiry/showroom/runtime.mjs"></script>
</body>
</html>
