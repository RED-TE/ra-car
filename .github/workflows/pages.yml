name: Deploy static homepage to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check public site
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify Crew before publishing
        run: npm run test:crew

      - name: Verify main and inquiry app entries before publishing
        run: npm run test:app-entries

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public site without test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/recar-public"
          tar --exclude='./node_modules' --exclude='./test-results' --exclude='./playwright-report' --exclude='./artifacts' --exclude='./.git' --exclude='./.github' --exclude='./docs' --exclude='./tools' --exclude='./tests' --exclude='./web_app' --exclude='./crew/friends/recar-friends-terms-v1.4-preview.pdf' -cf - . | tar -xf - -C "$RUNNER_TEMP/recar-public"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/recar-public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
