name: Deploy static homepage to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - tools/crew-worker-release.json
      - tools/verify-crew-production.cjs
      - tests/crew-production.test.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check public site
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify Crew before publishing
        run: npm run test:crew

      - name: Verify main and app entries before publishing
        run: npm run test:app-entries

      - name: Verify prepayment price and stale result clearing before publishing
        run: npx playwright test tests/e2e/app-prepayment-estimate.spec.js

      - name: Verify landing and stepwise inquiry before publishing
        run: npm run test:inquiry

      - name: Verify Kakao web callback before publishing
        run: npm run test:kakao

      - name: Verify the live Kakao API is ready before publishing
        run: npm run verify:kakao:production

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify live Crew route ownership before publishing
        run: npm run verify:crew:production -- --routing-only

      - name: Stage public site without test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/recar-public"
          tar --exclude='./node_modules' --exclude='./test-results' --exclude='./playwright-report' --exclude='./artifacts' --exclude='./.git' --exclude='./.github' --exclude='./docs' --exclude='./tools' --exclude='./tests' --exclude='./web_app' --exclude='./crew/friends/recar-friends-terms-v1.4-preview.pdf' -cf - . | tar -xf - -C "$RUNNER_TEMP/recar-public"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recar-public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify published app and vehicle image hashes
        run: node tools/verify-published-app.cjs

      - name: Record Pages failure status without credentials
        if: failure() && steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages/deployments/${process.env.GITHUB_SHA}`;
          fetch(url, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(15000),
          }).then(async response => {
            const data = await response.json().catch(() => ({}));
            console.log(JSON.stringify({ http: response.status, status: data.status ?? null, request_id: response.headers.get('x-github-request-id') }));
          }).catch(() => console.log('Pages status endpoint unavailable; original deployment remains failed.'));
          NODE

      - name: Verify the published Crew screens and session version
        run: npm run verify:crew:production -- --expect-local
